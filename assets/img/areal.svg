<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="arealTitle arealDesc">
  <title id="arealTitle">Plánek areálu S.K. Rváčov</title>
  <desc id="arealDesc">Schéma multifunkčního areálu: travnaté fotbalové hřiště, dvě antuková hřiště na nohejbal a volejbal, klubovna, kabiny, dětské hřiště a parkoviště.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#101619"/>
      <stop offset="1" stop-color="#070A0C"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E6B39"/>
      <stop offset="1" stop-color="#134C28"/>
    </linearGradient>
    <pattern id="mow" width="54" height="10" patternUnits="userSpaceOnUse">
      <rect width="27" height="10" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>
    <linearGradient id="clayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B5602F"/>
      <stop offset="1" stop-color="#8C441F"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B343A"/>
      <stop offset="1" stop-color="#1B2226"/>
    </linearGradient>
    <style>
      .lbl { font-family: "Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight: 700;
             font-size: 17px; letter-spacing: 1.6px; fill: #E8EEF0; text-transform: uppercase; }
      .sub { font-family: "Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight: 500;
             font-size: 13px; letter-spacing: 1.4px; fill: #8FA0A8; }
      .tag { font-family: "Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight: 700;
             font-size: 13px; letter-spacing: 2px; fill: #F2C14E; }
      .line { stroke: #ffffff; stroke-opacity: .78; fill: none; stroke-width: 2.4; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- jemná mřížka pozadí -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 40h800M0 120h800M0 200h800M0 280h800M0 360h800M0 440h800M0 520h800"/>
    <path d="M80 0v600M160 0v600M240 0v600M320 0v600M400 0v600M480 0v600M560 0v600M640 0v600M720 0v600"/>
  </g>

  <!-- ============ TRAVNATÉ HŘIŠTĚ ============ -->
  <g>
    <rect x="46" y="74" width="436" height="278" rx="6" fill="url(#grassGrad)"/>
    <rect x="46" y="74" width="436" height="278" rx="6" fill="url(#mow)"/>
    <rect x="46" y="74" width="436" height="278" rx="6" fill="none" stroke="#0B3A1E" stroke-width="3"/>

    <g class="line">
      <rect x="66" y="94" width="396" height="238"/>
      <path d="M264 94v238"/>
      <circle cx="264" cy="213" r="46"/>
      <rect x="66" y="148" width="58" height="130"/>
      <rect x="66" y="180" width="22" height="66"/>
      <rect x="404" y="148" width="58" height="130"/>
      <rect x="436" y="180" width="26" height="66"/>
    </g>
    <circle cx="264" cy="213" r="4" fill="#fff" fill-opacity=".85"/>
    <circle cx="112" cy="213" r="3.5" fill="#fff" fill-opacity=".7"/>
    <circle cx="416" cy="213" r="3.5" fill="#fff" fill-opacity=".7"/>

    <!-- branky -->
    <rect x="56" y="188" width="10" height="50" fill="#E9EEF0" fill-opacity=".55"/>
    <rect x="462" y="188" width="10" height="50" fill="#E9EEF0" fill-opacity=".55"/>
  </g>

  <text class="tag" x="46" y="60">01</text>
  <text class="lbl" x="74" y="60">Travnaté hřiště</text>
  <text class="sub" x="248" y="60">100 × 64 m &#183; hlavní plocha</text>

  <!-- ============ ANTUKA ============ -->
  <g>
    <rect x="524" y="74" width="230" height="128" rx="5" fill="url(#clayGrad)"/>
    <g class="line" stroke-width="2">
      <rect x="540" y="88" width="198" height="100"/>
      <path d="M639 88v100"/>
    </g>
    <path d="M639 82v112" stroke="#E9EEF0" stroke-opacity=".8" stroke-width="2.4" stroke-dasharray="5 5"/>

    <rect x="524" y="222" width="230" height="128" rx="5" fill="url(#clayGrad)"/>
    <g class="line" stroke-width="2">
      <rect x="540" y="236" width="198" height="100"/>
      <path d="M639 236v100"/>
    </g>
    <path d="M639 230v112" stroke="#E9EEF0" stroke-opacity=".8" stroke-width="2.4" stroke-dasharray="5 5"/>
  </g>

  <text class="tag" x="524" y="60">02</text>
  <text class="lbl" x="552" y="60">Antuka</text>
  <text class="sub" x="640" y="60">Nohejbal &#183; volejbal</text>

  <!-- ============ BUDOVY ============ -->
  <g>
    <!-- klubovna -->
    <rect x="46" y="410" width="212" height="122" rx="6" fill="url(#roofGrad)" stroke="#3A464D" stroke-width="2"/>
    <path d="M46 452h212" stroke="#3A464D" stroke-width="2"/>
    <g fill="#F2C14E" fill-opacity=".55">
      <rect x="70" y="472" width="26" height="34" rx="2"/>
      <rect x="112" y="472" width="26" height="34" rx="2"/>
      <rect x="154" y="472" width="26" height="34" rx="2"/>
    </g>
    <rect x="200" y="472" width="34" height="42" rx="2" fill="#C4131C" fill-opacity=".75"/>

    <!-- kabiny -->
    <rect x="278" y="410" width="150" height="122" rx="6" fill="url(#roofGrad)" stroke="#3A464D" stroke-width="2"/>
    <path d="M278 452h150" stroke="#3A464D" stroke-width="2"/>
    <g fill="#F2C14E" fill-opacity=".4">
      <rect x="300" y="472" width="22" height="30" rx="2"/>
      <rect x="338" y="472" width="22" height="30" rx="2"/>
      <rect x="376" y="472" width="22" height="30" rx="2"/>
    </g>
  </g>

  <text class="tag" x="46" y="396">03</text>
  <text class="lbl" x="74" y="396">Klubovna</text>
  <text class="sub" x="164" y="396">od 2007</text>
  <text class="tag" x="278" y="396">04</text>
  <text class="lbl" x="306" y="396">Kabiny</text>

  <!-- ============ DĚTSKÉ HŘIŠTĚ ============ -->
  <g>
    <rect x="448" y="410" width="150" height="122" rx="6" fill="#2A2118" stroke="#4A3A26" stroke-width="2"/>
    <circle cx="486" cy="452" r="15" fill="none" stroke="#F2C14E" stroke-opacity=".65" stroke-width="3"/>
    <path d="M470 500h44M492 500l-8-24M492 500l8-24" stroke="#F2C14E" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M534 500v-44h34v18l-34 26" stroke="#E3242B" stroke-opacity=".6" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <circle cx="560" cy="440" r="8" fill="#21B85A" fill-opacity=".5"/>
  </g>

  <text class="tag" x="448" y="396">05</text>
  <text class="lbl" x="476" y="396">Dětské hřiště</text>

  <!-- ============ PARKOVIŠTĚ ============ -->
  <g>
    <rect x="618" y="410" width="136" height="122" rx="6" fill="#161C20" stroke="#2A343A" stroke-width="2"/>
    <g stroke="#5C6A72" stroke-width="2" stroke-dasharray="4 6">
      <path d="M652 424v94M686 424v94M720 424v94"/>
    </g>
    <path d="M618 470h136" stroke="#5C6A72" stroke-width="1.6" stroke-opacity=".5"/>
  </g>

  <text class="tag" x="618" y="396">06</text>
  <text class="lbl" x="646" y="396">Parkoviště</text>

  <!-- ============ VSTUP ============ -->
  <g>
    <path d="M482 366h272" stroke="#3A464D" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M46 366h436" stroke="#3A464D" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="686" cy="366" r="7" fill="#E3242B"/>
    <circle cx="686" cy="366" r="13" fill="none" stroke="#E3242B" stroke-opacity=".4" stroke-width="2"/>
  </g>
  <text class="sub" x="704" y="371">VSTUP</text>

  <!-- ============ SEVERKA ============ -->
  <g transform="translate(756 552)">
    <circle r="22" fill="#0E1417" stroke="#2A343A" stroke-width="1.5"/>
    <path d="M0 -14 L5 4 L0 0 L-5 4 Z" fill="#E3242B"/>
    <text class="sub" x="0" y="16" text-anchor="middle" font-size="11">S</text>
  </g>

  <text class="sub" x="46" y="566">S.K. RVÁČOV &#183; RVÁČOV 60, 539 01 HLINSKO &#183; SCHÉMA AREÁLU</text>
</svg>
