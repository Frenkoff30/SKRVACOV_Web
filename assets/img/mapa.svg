<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Orientační mapa — Rváčov u Hlinska</title>
  <desc id="mapDesc">Zjednodušené schéma polohy areálu S.K. Rváčov severně od Hlinska. Není to navigační mapa, přesnou trasu najdete v mapové aplikaci.</desc>

  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#101619"/>
      <stop offset="1" stop-color="#080B0D"/>
    </linearGradient>
    <style>
      .town { font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight:700;
              font-size:19px; letter-spacing:2.4px; fill:#DCE4E7; }
      .road { font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight:600;
              font-size:12px; letter-spacing:1.6px; fill:#7E8D95; }
      .here { font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight:800;
              font-size:16px; letter-spacing:2.6px; fill:#F2C14E; }
      .note { font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight:500;
              font-size:12px; letter-spacing:1.8px; fill:#65737A; }
    </style>
  </defs>

  <rect width="800" height="500" fill="url(#mapBg)"/>

  <!-- lesy / zeleň -->
  <g fill="#17C" fill-opacity="0">
    <path d="M0 0h800v500H0z"/>
  </g>
  <g fill="#1A3A26" fill-opacity=".55">
    <path d="M-20 60 C 90 20, 190 40, 240 110 C 280 170, 190 210, 100 190 C 20 172, -30 130, -20 60Z"/>
    <path d="M600 300 C 690 270, 790 300, 820 370 L820 500 L560 500 C 540 430, 545 330, 600 300Z"/>
    <path d="M300 400 C 360 370, 430 390, 450 440 L455 500 L280 500 Z"/>
  </g>

  <!-- vodní plocha -->
  <path d="M470 60 C 530 46, 590 70, 610 110 C 626 146, 590 170, 545 160 C 496 150, 452 100, 470 60Z"
        fill="#12384A" fill-opacity=".75"/>
  <text class="note" x="512" y="118">RYBNÍK</text>

  <!-- silnice -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 470 C 180 430, 240 360, 300 300 C 360 240, 430 220, 520 236 C 620 254, 700 300, 790 300"
          stroke="#2A343A" stroke-width="16"/>
    <path d="M40 470 C 180 430, 240 360, 300 300 C 360 240, 430 220, 520 236 C 620 254, 700 300, 790 300"
          stroke="#4C5A61" stroke-width="4" stroke-dasharray="14 12"/>

    <path d="M300 300 C 280 240, 250 180, 232 120" stroke="#242D33" stroke-width="12"/>
    <path d="M300 300 C 280 240, 250 180, 232 120" stroke="#414E55" stroke-width="3" stroke-dasharray="10 10"/>

    <path d="M520 236 C 540 300, 560 360, 566 430" stroke="#242D33" stroke-width="10"/>
    <path d="M520 236 C 540 300, 560 360, 566 430" stroke="#414E55" stroke-width="3" stroke-dasharray="10 10"/>
  </g>

  <text class="road" x="392" y="212" transform="rotate(-6 392 212)">SILNICE NA HLINSKO</text>
  <text class="road" x="196" y="196" transform="rotate(-70 196 196)">SMĚR VÍTANOV</text>

  <!-- Hlinsko -->
  <g>
    <g fill="#2A343A" stroke="#3E4B52" stroke-width="1.5">
      <rect x="606" y="316" width="34" height="26" rx="3"/>
      <rect x="648" y="308" width="42" height="34" rx="3"/>
      <rect x="616" y="350" width="52" height="28" rx="3"/>
      <rect x="676" y="350" width="34" height="28" rx="3"/>
      <rect x="700" y="306" width="30" height="36" rx="3"/>
    </g>
    <circle cx="668" cy="342" r="6" fill="#8FA0A8"/>
  </g>
  <text class="town" x="606" y="404">HLINSKO</text>
  <text class="note" x="606" y="422">5 KM &#183; VLAK, AUTOBUS, SLUŽBY</text>

  <!-- Rváčov -->
  <g>
    <g fill="#2A343A" stroke="#3E4B52" stroke-width="1.5">
      <rect x="196" y="292" width="30" height="24" rx="3"/>
      <rect x="234" y="286" width="36" height="30" rx="3"/>
      <rect x="204" y="326" width="44" height="24" rx="3"/>
      <rect x="258" y="326" width="28" height="24" rx="3"/>
    </g>
  </g>
  <text class="town" x="150" y="372">RVÁČOV</text>

  <!-- areál klubu -->
  <g>
    <rect x="296" y="330" width="126" height="78" rx="8" fill="#14431F" stroke="#21B85A" stroke-width="2"/>
    <g stroke="#B9E7C9" stroke-opacity=".55" fill="none" stroke-width="1.6">
      <rect x="306" y="340" width="106" height="58"/>
      <path d="M359 340v58"/>
      <circle cx="359" cy="369" r="14"/>
    </g>
  </g>

  <!-- špendlík -->
  <g transform="translate(359 316)">
    <path d="M0 0 C -18 -22, -26 -32, -26 -46 A 26 26 0 1 1 26 -46 C 26 -32, 18 -22, 0 0Z"
          fill="#E3242B" stroke="#8E0A11" stroke-width="2"/>
    <circle cx="0" cy="-46" r="11" fill="#FCF7EE"/>
    <circle cx="0" cy="-46" r="5" fill="#C4131C"/>
  </g>
  <text class="here" x="298" y="430">S.K. RVÁČOV &#183; RVÁČOV 60</text>

  <!-- měřítko -->
  <g transform="translate(46 456)">
    <path d="M0 0h96" stroke="#4C5A61" stroke-width="2"/>
    <path d="M0 -5v10M48 -3v6M96 -5v10" stroke="#4C5A61" stroke-width="2"/>
    <text class="note" x="0" y="22">0</text>
    <text class="note" x="86" y="22">1 KM</text>
  </g>

  <!-- severka -->
  <g transform="translate(752 62)">
    <circle r="24" fill="#0E1417" stroke="#2A343A" stroke-width="1.5"/>
    <path d="M0 -15 L5.5 5 L0 0.5 L-5.5 5 Z" fill="#E3242B"/>
    <text class="note" x="0" y="18" text-anchor="middle">S</text>
  </g>

  <text class="note" x="46" y="42">ORIENTAČNÍ SCHÉMA &#183; NENÍ NAVIGAČNÍ MAPA</text>
</svg>
