<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Orientační schéma polohy areálu S.K. Rváčov</title>
  <desc id="mapDesc">Zjednodušené schéma. Areál leží v obci Rváčov severně od Hlinska. Nejde o navigační mapu, přesnou trasu najdete v mapové aplikaci.</desc>

  <defs>
    <style>
      .town { font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight:700;
              font-size:19px; letter-spacing:2px; fill:#14181B; }
      .road { font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight:600;
              font-size:12px; letter-spacing:1.4px; fill:#5C686F; }
      .here { font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight:800;
              font-size:15px; letter-spacing:1.8px; fill:#C4131C; }
      .note { font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight:500;
              font-size:12px; letter-spacing:1.4px; fill:#5C686F; }
    </style>
  </defs>

  <rect width="800" height="500" fill="#FAF8F6"/>

  <!-- lesy a zeleň -->
  <g fill="#DDEADF">
    <path d="M-20 60 C 90 20, 190 40, 240 110 C 280 170, 190 210, 100 190 C 20 172, -30 130, -20 60Z"/>
    <path d="M600 300 C 690 270, 790 300, 820 370 L820 500 L560 500 C 540 430, 545 330, 600 300Z"/>
    <path d="M300 400 C 360 370, 430 390, 450 440 L455 500 L280 500 Z"/>
  </g>

  <!-- vodní plocha -->
  <path d="M470 60 C 530 46, 590 70, 610 110 C 626 146, 590 170, 545 160 C 496 150, 452 100, 470 60Z"
        fill="#CFE2EC"/>
  <text class="note" x="512" y="118">RYBNÍK</text>

  <!-- silnice -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 470 C 180 430, 240 360, 300 300 C 360 240, 430 220, 520 236 C 620 254, 700 300, 790 300"
          stroke="#E8E1D8" stroke-width="17"/>
    <path d="M40 470 C 180 430, 240 360, 300 300 C 360 240, 430 220, 520 236 C 620 254, 700 300, 790 300"
          stroke="#FFFFFF" stroke-width="11"/>
    <path d="M40 470 C 180 430, 240 360, 300 300 C 360 240, 430 220, 520 236 C 620 254, 700 300, 790 300"
          stroke="#C2B6A9" stroke-width="2" stroke-dasharray="12 12"/>

    <path d="M300 300 C 280 240, 250 180, 232 120" stroke="#E8E1D8" stroke-width="12"/>
    <path d="M300 300 C 280 240, 250 180, 232 120" stroke="#FFFFFF" stroke-width="7"/>

    <path d="M520 236 C 540 300, 560 360, 566 430" stroke="#E8E1D8" stroke-width="11"/>
    <path d="M520 236 C 540 300, 560 360, 566 430" stroke="#FFFFFF" stroke-width="6"/>
  </g>

  <text class="road" x="392" y="210" transform="rotate(-6 392 210)">SILNICE NA HLINSKO</text>
  <text class="road" x="196" y="196" transform="rotate(-70 196 196)">SMĚR VÍTANOV</text>

  <!-- Hlinsko -->
  <g fill="#FFFFFF" stroke="#C2B6A9" stroke-width="1.5">
    <rect x="606" y="316" width="34" height="26" rx="3"/>
    <rect x="648" y="308" width="42" height="34" rx="3"/>
    <rect x="616" y="350" width="52" height="28" rx="3"/>
    <rect x="676" y="350" width="34" height="28" rx="3"/>
    <rect x="700" y="306" width="30" height="36" rx="3"/>
  </g>
  <text class="town" x="606" y="404">HLINSKO</text>
  <text class="note" x="606" y="422">VLAK, AUTOBUS, SLUŽBY</text>

  <!-- Rváčov -->
  <g fill="#FFFFFF" stroke="#C2B6A9" stroke-width="1.5">
    <rect x="196" y="292" width="30" height="24" rx="3"/>
    <rect x="234" y="286" width="36" height="30" rx="3"/>
    <rect x="204" y="326" width="44" height="24" rx="3"/>
    <rect x="258" y="326" width="28" height="24" rx="3"/>
  </g>
  <text class="town" x="150" y="372">RVÁČOV</text>

  <!-- areál klubu -->
  <g>
    <rect x="296" y="330" width="126" height="78" rx="8" fill="#2E9152" stroke="#155C31" stroke-width="2"/>
    <g stroke="#FFFFFF" stroke-opacity=".8" fill="none" stroke-width="1.6">
      <rect x="306" y="340" width="106" height="58"/>
      <path d="M359 340v58"/>
      <circle cx="359" cy="369" r="14"/>
    </g>
  </g>

  <!-- špendlík -->
  <g transform="translate(359 316)">
    <path d="M0 0 C -18 -22, -26 -32, -26 -46 A 26 26 0 1 1 26 -46 C 26 -32, 18 -22, 0 0Z"
          fill="#C4131C" stroke="#96070F" stroke-width="2"/>
    <circle cx="0" cy="-46" r="11" fill="#FFFFFF"/>
    <circle cx="0" cy="-46" r="5" fill="#C4131C"/>
  </g>
  <text class="here" x="298" y="430">S.K. RVÁČOV, RVÁČOV 60</text>

  <!-- severka -->
  <g transform="translate(752 62)">
    <circle r="24" fill="#FFFFFF" stroke="#C2B6A9" stroke-width="1.5"/>
    <path d="M0 -15 L5.5 5 L0 0.5 L-5.5 5 Z" fill="#C4131C"/>
    <text class="note" x="0" y="18" text-anchor="middle">S</text>
  </g>

  <text class="note" x="46" y="42">ORIENTAČNÍ SCHÉMA, NEJDE O NAVIGAČNÍ MAPU</text>
</svg>
