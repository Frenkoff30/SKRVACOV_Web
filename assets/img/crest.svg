<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="crestTitle">
  <title id="crestTitle">Znak S.K. Rváčov — fotbalový klub založený roku 1927</title>
  <defs>
    <path id="arcTop" d="M 24,100 A 76,76 0 0 1 176,100" fill="none"/>
    <path id="arcBottom" d="M 12,100 A 88,88 0 0 0 188,100" fill="none"/>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D81C25"/>
      <stop offset="1" stop-color="#8E0A11"/>
    </linearGradient>
  </defs>

